{% set version = "3.8.1" %}

package:
  name: shellescape
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/s/shellescape/shellescape-{{ version }}.tar.gz
  sha256: 40b310b30479be771bf3ab28bd8d40753778488bd46ea0969ba0b35038c3ec26

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - shellescape

about:
  home: https://github.com/chrissimpkins/shellescape
  license: MIT
  license_family: MIT
  license_file: docs/LICENSE
  summary: Shell escape a string to safely use it as a token in a shell command (backport of Python shlex.quote for Python versions 2.x & < 3.3)
  doc_url: https://github.com/chrissimpkins/shellescape/blob/master/docs/README.rst
  dev_url: https://github.com/chrissimpkins/shellescape

extra:
  recipe-maintainers:
    - croth1
